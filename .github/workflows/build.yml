name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|error:|Execution failed|not found|Could not" -A4 build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landroid-apk
          path: |
            CinnamonBun/build/outputs/apk/debug/*.apk
            build.log
